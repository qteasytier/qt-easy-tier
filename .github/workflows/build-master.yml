name: Build Master

on:
  push:
    branches:
      - master
  # 支持手动触发构建（Repository 页面 → Actions → Build Master → Run workflow）
  workflow_dispatch:

jobs:
  linux-deb:
    name: Linux build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    # 提交信息以 docs 开头时跳过构建（仅文档变更，无需产物）；手动触发时始终执行
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'docs') }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            qt_arch: linux_gcc_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            qt_arch: linux_gcc_arm64

    steps:
      - name: Build and test
        id: build
        uses: ./.github/actions/build-linux
        with:
          qt_arch: ${{ matrix.qt_arch }}
          extract_version: 'true'

      - name: Build deb package
        working-directory: ${{ github.workspace }}/build/Output
        run: |
          bash "${{ github.workspace }}/assets/package/linux/build_deb.sh" \
            -v "${{ steps.build.outputs.version }}" \
            -a "${{ matrix.arch }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qteasytier-v${{ steps.build.outputs.version }}-linux-${{ matrix.arch }}
          path: |
            build/Output/qteasytier_v${{ steps.build.outputs.version }}_linux_${{ matrix.arch }}.deb
          if-no-files-found: error

  windows-zip:
    name: Windows build amd64
    runs-on: windows-2022
    # 提交信息以 docs 开头时跳过构建（仅文档变更，无需产物）；手动触发时始终执行
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'docs') }}

    env:
      BUILD_DIR: build
      MSYSTEM: UCRT64
      CHERE_INVOKING: 1

    steps:
      - name: Build and test
        id: build
        uses: ./.github/actions/build-windows
        with:
          extract_version: 'true'
          check_deploy_tools: 'true'

      - name: Prepare runtime files
        shell: msys2 {0}
        run: |
          find "$BUILD_DIR/Output" -maxdepth 1 -type f \( -name '*.a' -o -name '*.lib' -o -name 'tst*' \) -delete
          export PATH="/ucrt64/share/qt6/bin:$PATH"
          cd "$BUILD_DIR/Output"
          windeployqt.exe --release --force \
            --qmldir ../../src/qml \
            --qml-deploy-dir ./share/qt6/qml \
            ./appQtEasyTier.exe

          iter=0
          changed=1
          while [ "$changed" -eq 1 ] && [ "$iter" -lt 10 ]; do
            changed=0
            iter=$((iter + 1))
            while IFS= read -r -d '' file; do
              while IFS= read -r dll; do
                if [ -f "/ucrt64/bin/$dll" ] && [ ! -f "./$dll" ]; then
                  cp "/ucrt64/bin/$dll" .
                  changed=1
                fi
              done < <(objdump -p "$file" 2>/dev/null | awk '/DLL Name:/ {print $3}')
            done < <(find . -type f \( -name '*.exe' -o -name '*.dll' \) -print0)
          done

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ steps.build.outputs.version }}"
          $sourceRoot = "${{ github.workspace }}"
          $buildOutput = Join-Path $sourceRoot "build\Output"
          $packageOutput = Join-Path $sourceRoot "build\Package"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe not found at $iscc"
          }
          New-Item -ItemType Directory -Path $packageOutput -Force | Out-Null

          & $iscc `
            "/DMyAppVersion=$version" `
            "/DBuildOutputDir=$buildOutput" `
            "/DPackageOutputDir=$packageOutput" `
            "/DSourceRootDir=$sourceRoot" `
            "assets\package\windows\package.iss"

      - name: Create zip package
        shell: pwsh
        run: |
          $version = "${{ steps.build.outputs.version }}"
          $zipPath = "build/Output/qteasytier_v${version}_windows_amd64.zip"
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }
          Compress-Archive -Path "build/Output/*" -DestinationPath $zipPath -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qteasytier-v${{ steps.build.outputs.version }}-windows-amd64
          path: |
            build/Output/qteasytier_v${{ steps.build.outputs.version }}_windows_amd64.zip
          if-no-files-found: error

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: qteasytier-v${{ steps.build.outputs.version }}-windows-amd64-installer
          path: |
            build/Package/qteasytier_v${{ steps.build.outputs.version }}_windows_amd64.exe
          if-no-files-found: error
