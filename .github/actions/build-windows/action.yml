name: Build And Test Windows
description: 在 Windows 上安装 MSYS2 环境与 Qt，配置、构建并运行测试。

inputs:
  build_dir:
    description: CMake 构建目录。
    required: false
    default: build
  extract_version:
    description: 是否从 CMakeLists.txt 提取项目版本号并作为 outputs.version 输出。
    required: false
    default: 'false'
  check_deploy_tools:
    description: 是否检查 windeployqt 与 qmlimportscanner 等打包工具。
    required: false
    default: 'false'

outputs:
  version:
    description: 从 CMakeLists.txt 提取的项目版本号。
    value: ${{ steps.version.outputs.version }}

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Extract project version
      if: ${{ inputs.extract_version == 'true' }}
      id: version
      shell: bash
      run: |
        VERSION="$(grep -E '^project\(QtEasyTier VERSION ' CMakeLists.txt | sed -E 's/.*VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
        if [ -z "$VERSION" ]; then
          echo "Failed to extract version from CMakeLists.txt"
          exit 1
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          git
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ninja
          mingw-w64-ucrt-x86_64-openssl
          mingw-w64-ucrt-x86_64-qt6-base
          mingw-w64-ucrt-x86_64-qt6-declarative
          mingw-w64-ucrt-x86_64-qt6-svg
          mingw-w64-ucrt-x86_64-qt6-tools

    - name: Show Qt version
      shell: msys2 {0}
      run: |
        qmake6 -query QT_VERSION
        qmake6 -query QT_INSTALL_PREFIX

    - name: Verify deploy tools
      if: ${{ inputs.check_deploy_tools == 'true' }}
      shell: msys2 {0}
      run: |
        which windeployqt
        test -f /ucrt64/share/qt6/bin/qmlimportscanner.exe

    - name: Configure
      shell: msys2 {0}
      run: |
        cmake -S . -B "${{ inputs.build_dir }}" \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release

    - name: Build
      shell: msys2 {0}
      run: |
        cmake --build "${{ inputs.build_dir }}" --parallel "$(nproc)"

    - name: Run tests
      shell: msys2 {0}
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        ctest --test-dir "${{ inputs.build_dir }}" --output-on-failure
