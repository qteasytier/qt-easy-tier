# =====================================================================
# QtEasyTier CNB 流水线 —— Windows 构建（amd64）
# 注意：由于CNB中的Windows环境存在一些问题，现在不再在CNB引入Windows构建，此文件仅作备份
# =====================================================================

# 从 CMakeLists.txt 提取版本号（master / PR 使用）
.st-win-extract-version: &st-win-extract-version
  name: extract-version
  script: |
    $line = Select-String -Path CMakeLists.txt -Pattern '^project\(QtEasyTier VERSION ' | Select-Object -First 1
    if (-not $line) { throw '无法从 CMakeLists.txt 提取版本号' }
    $version = $line.Line -replace '^project\(QtEasyTier VERSION ([0-9]+\.[0-9]+\.[0-9]+).*', '$1'
    Write-Output "##[set-output VERSION=$version]"
  exports:
    VERSION: QTET_VERSION

# v* 分支专用：校验分支名版本与 CMakeLists.txt 一致
.st-win-extract-version-release: &st-win-extract-version-release
  name: extract-version
  script: |
    $branch = $env:CNB_BRANCH
    if (-not $branch.StartsWith('v')) { throw "分支 $branch 不是 v* release 分支" }
    $version = $branch.Substring(1)
    $pattern = '^project\(QtEasyTier VERSION ' + [regex]::Escape($version) + '\)'
    $line = Select-String -Path CMakeLists.txt -Pattern $pattern | Select-Object -First 1
    if (-not $line) { throw "CMakeLists.txt 中的版本与分支 $branch 不一致" }
    Write-Output "##[set-output VERSION=$version]"
  exports:
    VERSION: QTET_VERSION

# MSYS2 构建：configure + build + test
# 进入 clang64 bash 环境执行（MSYSTEM=CLANG64），完整加载 MSYS2/Qt6 环境变量
.st-win-build-full: &st-win-build-full
  name: build-msys2
  script: |
    $bash = @('C:\msys64\usr\bin\bash.exe', 'D:\msys64\usr\bin\bash.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
    if (-not $bash) { throw '未找到 MSYS2 bash.exe，请确认构建机上已安装 MSYS2/CLANG64 并配置好 Qt6 工具链' }

    $script = @'
    set -euxo pipefail
    export MSYSTEM=CLANG64
    export CHERE_INVOKING=1
    export PATH="/clang64/bin:/usr/bin:/clang64/share/qt6/bin:$PATH"
    cd "$(cygpath "$CNB_BUILD_WORKSPACE")"

    # 0. Show Qt version（对应 GitHub Show Qt version 步骤）
    qmake6 -query QT_VERSION
    qmake6 -query QT_INSTALL_PREFIX
    which windeployqt
    test -f /clang64/share/qt6/bin/qmlimportscanner.exe

    # 1. Configure（默认会克隆并构建 qtet-daemon，需要网络；后端从 CNB 克隆）
    #    编译器由 CMake 自动探测，无需指定
    cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
      -DCLONE_DAEMON_FROM=CNB

    # 2. Build
    cmake --build build --parallel

    # 3. Test
    export QT_QPA_PLATFORM=offscreen
    ctest --test-dir build --output-on-failure
    '@
    # 写入临时脚本文件再执行，避免 PowerShell 向 bash.exe 传多行引号参数被破坏
    $tmp = Join-Path $env:TEMP 'qtet_msys2_build.sh'
    [System.IO.File]::WriteAllText($tmp, $script.Replace("`r`n", "`n"))
    & $bash $tmp
    if ($LASTEXITCODE -ne 0) { throw "MSYS2 构建失败，退出码 $LASTEXITCODE" }

# 运行时准备：清理静态库 + windeployqt + 迭代补齐缺失 DLL（对应 GitHub Prepare runtime files 步骤）
.st-win-runtime: &st-win-runtime
  name: prepare-runtime
  script: |
    $bash = @('C:\msys64\usr\bin\bash.exe', 'D:\msys64\usr\bin\bash.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
    if (-not $bash) { throw '未找到 MSYS2 bash.exe，请确认构建机上已安装 MSYS2/CLANG64 并配置好 Qt6 工具链' }

    $script = @'
    set -euxo pipefail
    export MSYSTEM=CLANG64
    export CHERE_INVOKING=1
    export PATH="/clang64/bin:/usr/bin:/clang64/share/qt6/bin:$PATH"
    cd "$(cygpath "$CNB_BUILD_WORKSPACE")"

    # 1. 清理静态库与测试程序
    find build/Output -maxdepth 1 -type f \( -name '*.a' -o -name '*.lib' -o -name 'tst*' \) -delete

    # 2. windeployqt 部署 Qt 运行库
    cd build/Output
    windeployqt.exe --release --force \
      --qmldir ../../src/qml \
      --qml-deploy-dir ./share/qt6/qml \
      ./appQtEasyTier.exe

    # 3. 迭代补齐缺失 DLL（objdump 扫描导入表，最多 10 轮覆盖传递依赖）
    iter=0
    changed=1
    while [ "$changed" -eq 1 ] && [ "$iter" -lt 10 ]; do
      changed=0
      iter=$((iter + 1))
      while IFS= read -r -d '' file; do
        while IFS= read -r dll; do
          if [ -f "/clang64/bin/$dll" ] && [ ! -f "./$dll" ]; then
            cp "/clang64/bin/$dll" .
            changed=1
          fi
        done < <(objdump -p "$file" 2>/dev/null | awk '/DLL Name:/ {print $3}')
      done < <(find . -type f \( -name '*.exe' -o -name '*.dll' \) -print0)
    done
    '@
    $tmp = Join-Path $env:TEMP 'qtet_windeployqt.sh'
    [System.IO.File]::WriteAllText($tmp, $script.Replace("`r`n", "`n"))
    & $bash $tmp
    if ($LASTEXITCODE -ne 0) { throw "windeployqt 失败，退出码 $LASTEXITCODE" }

# 打包 zip（对应 GitHub Create zip package 步骤）：zip 输出到 build/Output，与 GitHub 一致
# 注意：必须先于本步骤完成安装包构建，否则 zip 会被打包进安装包（package.iss 以 build/Output 为源）
.st-win-zip: &st-win-zip
  name: create-zip
  env:
    QTET_VERSION: $QTET_VERSION
  script: |
    $version = $env:QTET_VERSION
    $zipPath = "build\Output\qteasytier_v${version}_windows_amd64.zip"
    if (Test-Path $zipPath) { Remove-Item $zipPath }
    Compress-Archive -Path "build\Output\*" -DestinationPath $zipPath -Force
    Write-Output "已创建 $zipPath"

# Inno Setup 安装包（对应 GitHub Build installer 步骤，ISCC 已加入 PATH，直接调用）
# 输出到独立的 build/Package 目录，避免与运行时文件（build/Output）混在一起
.st-win-installer: &st-win-installer
  name: build-installer
  env:
    QTET_VERSION: $QTET_VERSION
  script: |
    $version = $env:QTET_VERSION
    $root = $env:CNB_BUILD_WORKSPACE

    $buildOut = Join-Path $root 'build\Output'
    $packageOut = Join-Path $root 'build\Package'
    New-Item -ItemType Directory -Path $packageOut -Force | Out-Null
    $iss = Join-Path $root 'package\windows\package.iss'
    & ISCC "/DMyAppVersion=$version" "/DBuildOutputDir=$buildOut" "/DPackageOutputDir=$packageOut" "/DSourceRootDir=$root" $iss
    if ($LASTEXITCODE -ne 0) { throw "Inno Setup 打包失败，退出码 $LASTEXITCODE" }

# 上传 commit 附件（master / PR）：
# Windows 自托管 runner 无 Docker，无法运行 cnbcool/attachments 插件（会报
# "Runner does not enable Docker."）。改为通过 CNB OpenAPI 三步式上传：
#   1. POST /{repo}/-/git/commit-assets/{sha1}/asset-upload-url 获取 upload_url + verify_url
#   2. PUT 文件二进制到 upload_url
#   3. POST verify_url（完整 URL）确认上传
# 全程纯 HTTP，凭 $CNB_TOKEN 认证，不依赖 Docker。
.st-win-upload-attachments: &st-win-upload-attachments
  name: upload-attachments
  env:
    QTET_VERSION: $QTET_VERSION
  script: |
    $ErrorActionPreference = 'Stop'
    $repo = $env:CNB_REPO_SLUG
    $sha1 = $env:CNB_COMMIT
    $token = $env:CNB_TOKEN
    $version = $env:QTET_VERSION
    $api = "https://api.cnb.cool"
    $headers = @{ Authorization = "Bearer $token"; Accept = "application/vnd.cnb.api+json" }

    # PR 事件无安装包，此处过滤不存在的文件，只上传实际产物
    $files = @(
      "build\Output\qteasytier_v${version}_windows_amd64.zip",
      "build\Package\qteasytier_v${version}_windows_amd64.exe"
    ) | Where-Object { Test-Path $_ }

    foreach ($f in $files) {
      $name = Split-Path $f -Leaf
      $size = (Get-Item $f).Length
      Write-Output "上传 commit 附件: $name ($size bytes)"

      # 1. 获取上传地址
      $resp = Invoke-RestMethod -Uri "$api/$repo/-/git/commit-assets/$sha1/asset-upload-url" -Method Post `
        -Headers $headers -ContentType "application/json" `
        -Body (@{ asset_name = $name; size = $size } | ConvertTo-Json)

      # 2. PUT 文件到预签名地址
      $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $f))
      Invoke-WebRequest -Uri $resp.upload_url -Method Put -Body $bytes -UseBasicParsing | Out-Null

      # 3. POST verify_url 完成确认（verify_url 已含完整路径与编码）
      Invoke-RestMethod -Uri $resp.verify_url -Method Post -Headers $headers | Out-Null
      Write-Output "上传成功: $name"
    }

# 上传 release 附件（v* release）：
# 与 commit 附件同理，改用 release 接口；先按 tag 取 release_id，再三步式上传。
# Windows 侧无 publish-release，release 未就绪时允许失败，不阻塞构建。
.st-win-upload-release-attachments: &st-win-upload-release-attachments
  name: upload-release-attachments
  env:
    QTET_VERSION: $QTET_VERSION
  script: |
    $ErrorActionPreference = 'Stop'
    $repo = $env:CNB_REPO_SLUG
    $token = $env:CNB_TOKEN
    $version = $env:QTET_VERSION
    $api = "https://api.cnb.cool"
    $headers = @{ Authorization = "Bearer $token"; Accept = "application/vnd.cnb.api+json" }

    # 0. 按 tag 取 release_id
    $rel = Invoke-RestMethod -Uri "$api/$repo/-/releases/tags/$version" -Method Get -Headers $headers
    $releaseId = $rel.id
    if (-not $releaseId) { throw "未找到 tag=$version 对应的 release" }

    $files = @(
      "build\Output\qteasytier_v${version}_windows_amd64.zip",
      "build\Package\qteasytier_v${version}_windows_amd64.exe"
    ) | Where-Object { Test-Path $_ }

    foreach ($f in $files) {
      $name = Split-Path $f -Leaf
      $size = (Get-Item $f).Length
      Write-Output "上传 release 附件: $name ($size bytes)"

      # 1. 获取上传地址
      $resp = Invoke-RestMethod -Uri "$api/$repo/-/releases/$releaseId/asset-upload-url" -Method Post `
        -Headers $headers -ContentType "application/json" `
        -Body (@{ asset_name = $name; size = $size } | ConvertTo-Json)

      # 2. PUT 文件到预签名地址
      $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $f))
      Invoke-WebRequest -Uri $resp.upload_url -Method Put -Body $bytes -UseBasicParsing | Out-Null

      # 3. POST verify_url 完成确认
      Invoke-RestMethod -Uri $resp.verify_url -Method Post -Headers $headers | Out-Null
      Write-Output "上传成功: $name"
    }
  allowFailure: true

# =====================================================================
# Pipeline 基础配置（YAML 锚点，供各事件引用）
# =====================================================================

# Windows：你自己连接的构建机（namespace: group + 节点标签）
# 若你的构建机标签不是 "windows"，请在此处改为实际标签（如 [windows, x86_64]）。
.win: &win
  runner:
    namespace: group
    tags:
      - windows

# =====================================================================
# 事件编排（Windows 部分）
# =====================================================================

# ---- master 分支 push：构建 + 测试 + 打包 + 上传附件（对应 build-master.yml） ----
# 阶段顺序与 GitHub 一致：installer 必须先于 zip，避免 zip 被打进安装包
master:
  push:
    windows:
      <<: *win
      name: Windows amd64 (master)
      stages:
        - *st-win-extract-version
        - *st-win-build-full
        - *st-win-runtime
        - *st-win-installer
        - *st-win-zip
        - *st-win-upload-attachments

# ---- 任意分支 PR：仅构建 + 测试 + 上传（对齐 build-pr.yml，不打包安装包） ----
# CNB 附件上传按文件逐个上传，故先打一个 zip 再作为 commit 附件上传
"**":
  pull_request:
    windows:
      <<: *win
      name: Windows amd64 (PR check)
      stages:
        - *st-win-extract-version
        - *st-win-build-full
        - *st-win-zip
        - *st-win-upload-attachments

# ---- vX.Y.Z 分支 push：构建 + 打包 + 上传 release 附件（对应 build-release.yml） ----
v*:
  push:
    windows:
      <<: *win
      name: Windows amd64 (release)
      stages:
        - *st-win-extract-version-release
        - *st-win-build-full
        - *st-win-runtime
        - *st-win-installer
        - *st-win-zip
        - *st-win-upload-release-attachments
