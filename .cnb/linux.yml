# =====================================================================
# QtEasyTier CNB 流水线 —— Linux 构建（amd64 / arm64）
#
# 本文件由根目录 .cnb.yml 通过 include 引入，与 .cnb/windows.yml 合并。
#
# 平台说明：
#   - 使用 CNB 官方节点（cnb:arch:amd64 / cnb:arch:arm64:v8）。
#   - 构建环境（系统依赖 + Qt 6.8.3）固化在 docker/linux-build.Dockerfile 中，
#     通过 docker.build 动态构建镜像机制由 CNB 平台按哈希自动缓存到制品库：
#     首次构建执行完整安装并推送，后续构建直接复用缓存的环境镜像，无需重复安装。
#   - 镜像内已通过 ENV 将 Qt bin 目录加入 PATH、Qt lib 目录加入 LD_LIBRARY_PATH，
#     并固化 Qt6_DIR 供 configure / build / test 使用。
#
# =====================================================================

# =====================================================================
# Linux 公共 Stage（脚本走默认 shell，语法兼容 POSIX sh）
# =====================================================================

# 从 CMakeLists.txt 提取版本号（master / PR 使用）
.st-extract-version: &st-extract-version
  name: extract-version
  script: |
    VERSION="$(grep -E '^project\(QtEasyTier VERSION ' CMakeLists.txt | sed -E 's/^project\(QtEasyTier VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
    if [ -z "$VERSION" ]; then
      echo "无法从 CMakeLists.txt 提取版本号" >&2
      exit 1
    fi
    echo "##[set-output VERSION=$VERSION]"
  exports:
    VERSION: QTET_VERSION

.st-configure: &st-configure
  name: configure
  script: |
    # Qt6_DIR 由环境镜像 ENV 固化提供；此处为兜底：若镜像内变量未生效，
    # 按构建架构推导 aqt 实际安装目录（无 linux_ 前缀）
    if [ -z "${Qt6_DIR:-}" ]; then
      if [ "$QTET_BUILD_ARCH" = "arm64" ]; then
        Qt6_DIR="/opt/qt/${QT_VERSION:-6.8.3}/gcc_arm64"
      else
        Qt6_DIR="/opt/qt/${QT_VERSION:-6.8.3}/gcc_64"
      fi
      echo "Qt6_DIR 为空，已按 QTET_BUILD_ARCH=$QTET_BUILD_ARCH 推导为 $Qt6_DIR"
    fi
    # 目录校验：失败时打印实际内容，便于快速定位模块目录名
    if [ ! -d "$Qt6_DIR" ]; then
      echo "Qt6_DIR 目录不存在: $Qt6_DIR" >&2
      echo "--- /opt/qt 实际内容 ---"
      ls -R /opt/qt 2>/dev/null || true
      exit 1
    fi
    # 后端从 CNB 克隆（qtet-daemon 仓库托管于 cnb.cool）
    cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$Qt6_DIR" -DCLONE_DAEMON_FROM=CNB

.st-build: &st-build
  name: build
  script: cmake --build build --parallel "$(nproc)"

.st-test: &st-test
  name: test
  env:
    QT_QPA_PLATFORM: offscreen
    # 测试可执行文件动态链接 Qt 库，显式指向 Qt 安装目录（双保险，防 RPATH 失效）
    LD_LIBRARY_PATH: $Qt6_DIR/lib
  script: ctest --test-dir build --output-on-failure

# 打 deb 包（build_deb.sh 以当前目录作为输出目录，故先 cd 到 build/Output）
.st-package-deb: &st-package-deb
  name: package-deb
  script: |
    cd build/Output
    bash ../../assets/package/linux/build_deb.sh -v "$QTET_VERSION" -a "$QTET_BUILD_ARCH"

# 上传 commit 附件（master / PR）：不指定 tag/commit，插件默认取 $CNB_COMMIT 挂到
# 当前提交，构建页面即可"附件签出"下载 .deb 安装包。
.st-upload-attachments: &st-upload-attachments
  name: upload-attachments
  image: cnbcool/attachments:latest
  settings:
    attachments:
      - "./build/Output/qteasytier_v*.deb"

# =====================================================================
# Pipeline 基础配置（YAML 锚点，供各事件引用）
# =====================================================================

# 提交信息以 docs 开头时跳过构建（仅 master 构建使用）。
# 用法：在 Stage 上声明 if: *st-if-not-docs，脚本退出码为 0 时才执行；
#       提交信息首行（CNB_COMMIT_MESSAGE_TITLE）以 docs 开头时退出码为 1，跳过全部任务。
.st-if-not-docs: &st-if-not-docs |
  case "$CNB_COMMIT_MESSAGE_TITLE" in
    docs*) exit 1 ;;
    *) exit 0 ;;
  esac

# Linux amd64：官方节点 + 动态构建环境镜像（docker/linux-build.Dockerfile，缓存复用）
.lnx-amd64: &lnx-amd64
  runner:
    tags: cnb:arch:amd64
  docker:
    # 动态构建镜像：CNB 按哈希（Dockerfile + buildArgs + arch）自动缓存到制品库，
    # 命中直接复用，未命中才构建并推送
    build:
      dockerfile: docker/linux-build.Dockerfile
      buildArgs:
        QT_VERSION: 6.8.3
        QT_HOST: linux
        QT_ARCH: linux_gcc_64
        QT_DIR_NAME: gcc_64
  env:
    QTET_BUILD_ARCH: amd64
    QT_VERSION: 6.8.3
    # aqt 下载参数（供 Qt6_DIR fallback 兜底）：QT_ARCH 为 aqt 模块标识，QT_DIR_NAME 为安装目录名
    QT_HOST: linux
    QT_ARCH: linux_gcc_64
    QT_DIR_NAME: gcc_64

# Linux arm64：官方节点 + 动态构建环境镜像（docker/linux-build.Dockerfile，缓存复用）
# QT_HOST=linux_arm64：让 aqt 从 Qt 官方 linux_arm64 仓库下载（对应 GitHub 原生 ARM runner）
.lnx-arm64: &lnx-arm64
  runner:
    tags: cnb:arch:arm64:v8
  docker:
    # 动态构建镜像：CNB 按哈希（Dockerfile + buildArgs + arch）自动缓存到制品库，
    # 命中直接复用，未命中才构建并推送
    build:
      dockerfile: docker/linux-build.Dockerfile
      buildArgs:
        QT_VERSION: 6.8.3
        QT_HOST: linux_arm64
        QT_ARCH: linux_gcc_arm64
        QT_DIR_NAME: gcc_arm64
  env:
    QTET_BUILD_ARCH: arm64
    QT_VERSION: 6.8.3
    # aqt 下载参数（供 Qt6_DIR fallback 兜底）：QT_ARCH 为 aqt 模块标识，QT_DIR_NAME 为安装目录名
    QT_HOST: linux_arm64
    QT_ARCH: linux_gcc_arm64
    QT_DIR_NAME: gcc_arm64

# =====================================================================
# 事件编排（Linux 部分）
# =====================================================================

# ---- master 分支 push：构建 + 测试 + 打包 ----
# 提交信息以 docs 开头时跳过整个构建（仅文档变更，无需产物），
# 通过 Stage 级 if 条件统一管控，PR 流水线不受影响。
master:
  push:
    linux-amd64:
      <<: *lnx-amd64
      name: Linux amd64 (master)
      stages:
        - name: QtEasyTier master build (amd64)
          if: *st-if-not-docs
          jobs:
            - *st-extract-version
            - *st-configure
            - *st-build
            - *st-test
            - *st-package-deb
            - *st-upload-attachments
    linux-arm64:
      <<: *lnx-arm64
      name: Linux arm64 (master)
      stages:
        - name: QtEasyTier master build (arm64)
          if: *st-if-not-docs
          jobs:
            - *st-extract-version
            - *st-configure
            - *st-build
            - *st-test
            - *st-package-deb
            - *st-upload-attachments

# ---- 任意分支 PR：构建 + 测试 + 打包 + 上传附件 ----
"**":
  pull_request:
    linux-amd64:
      <<: *lnx-amd64
      name: Linux amd64 (PR check)
      stages:
        - *st-extract-version
        - *st-configure
        - *st-build
        - *st-test
        - *st-package-deb
        - *st-upload-attachments
    linux-arm64:
      <<: *lnx-arm64
      name: Linux arm64 (PR check)
      stages:
        - *st-extract-version
        - *st-configure
        - *st-build
        - *st-test
        - *st-package-deb
        - *st-upload-attachments
