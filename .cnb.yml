# =====================================================================
# QtEasyTier CNB 流水线（.cnb.yml）
#
# 本文件仅通过 include 引用各平台的独立构建配置，平台构建逻辑拆分在：
#   - .cnb/linux.yml    -> Linux amd64 / arm64 构建（官方节点 + ubuntu:24.04）
#   - .cnb/windows.yml  -> Windows amd64 构建（自托管构建机 + MSYS2/CLANG64）
#
# 参考 GitHub 流水线：
#   .github/workflows/build-master.yml   -> master 分支 push（Linux amd64/arm64 + Windows amd64）
#   .github/workflows/build-pr.yml       -> 任意分支 PR（Linux amd64/arm64 + Windows amd64，仅构建+测试）
#   .github/workflows/build-release.yml  -> vX.Y.Z 分支 push（构建 + 打包 + 发布 Release）
#
# 说明：
#   - CNB 的 YAML 锚点（&/*）不支持跨文件引用，各平台文件内部锚点自包含。
#   - include 合并规则：对象递归合并（同名键覆盖）、数组追加；同名事件下的不同
#     pipeline（如 master.push 下的 linux-amd64 / linux-arm64 / windows）会并存。
#   - 产物说明：CNB 会在构建页面自动保留工作目录中的产物（build/Output），无需显式上传。
# =====================================================================

include:
  - .cnb/linux.yml
  - .cnb/windows.yml
