# QtEasyTier CNB 流水线（.cnb.yml）
#
# 参考 GitHub 流水线：
#   .github/workflows/build-master.yml   -> master 分支 push（Linux amd64/arm64 + Windows amd64）
#   .github/workflows/build-pr.yml       -> 任意分支 PR（Linux amd64/arm64 + Windows amd64，仅构建+测试）
#   .github/workflows/build-release.yml  -> vX.Y.Z 分支 push（构建 + 打包 + 发布 Release）
#
# 平台说明：
#   - Linux：使用 CNB 官方节点（cnb:arch:amd64 / cnb:arch:arm64:v8），构建环境由
#     .cnb/Dockerfile.linux 提供（预装系统依赖 + Qt 6.8.3），镜像由 CNB 自动缓存。
#   - Windows：使用你自己连接的构建机（runner.namespace: group + runner.tags），
#     构建机上已装好 MSYS2/CLANG64 + Qt6 工具链（含 Inno Setup），流水线不安装任何
#     依赖，直接进入源码编译。Windows 无 Docker 构建环境，stage 脚本默认走 PowerShell，
#     MSYS2 构建通过调用 C:\msys64\usr\bin\bash.exe 完成。
#
# 产物说明：CNB 会在构建页面自动保留工作目录中的产物（build/Output），无需显式上传。
#   注意：若你的构建机标签不是 "windows"，请修改下方 .win 锚点中的 runner.tags。

# =====================================================================
# Linux 公共 Stage（脚本走默认 shell，语法兼容 POSIX sh）
# =====================================================================

# 从 CMakeLists.txt 提取版本号（master / PR 使用）
.st-extract-version: &st-extract-version
  name: extract-version
  script: |
    VERSION="$(grep -E '^project\(QtEasyTier VERSION ' CMakeLists.txt | sed -E 's/^project\(QtEasyTier VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
    if [ -z "$VERSION" ]; then
      echo "无法从 CMakeLists.txt 提取版本号" >&2
      exit 1
    fi
    echo "##[set-output VERSION=$VERSION]"
  exports:
    VERSION: QTET_VERSION

# v* 分支专用：校验分支名版本与 CMakeLists.txt 一致（对应 GitHub release-info job）
.st-extract-version-release: &st-extract-version-release
  name: extract-version
  script: |
    VERSION="${CNB_BRANCH#v}"
    if [ "$VERSION" = "$CNB_BRANCH" ]; then
      echo "分支 $CNB_BRANCH 不是 v* release 分支" >&2
      exit 1
    fi
    CM_VERSION="$(grep -E '^project\(QtEasyTier VERSION ' CMakeLists.txt | sed -E 's/^project\(QtEasyTier VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
    if [ "$CM_VERSION" != "$VERSION" ]; then
      echo "CMakeLists.txt 中的版本 $CM_VERSION 与分支 $CNB_BRANCH 不一致" >&2
      exit 1
    fi
    echo "##[set-output VERSION=$VERSION]"
  exports:
    VERSION: QTET_VERSION

.st-show-qt: &st-show-qt
  name: show-qt
  script: |
    qmake -query QT_VERSION
    qmake -query QT_INSTALL_PREFIX

.st-configure: &st-configure
  name: configure
  script: |
    cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$Qt6_DIR"

.st-build: &st-build
  name: build
  script: cmake --build build --parallel "$(nproc)"

.st-test: &st-test
  name: test
  env:
    QT_QPA_PLATFORM: offscreen
  script: ctest --test-dir build --output-on-failure

# 打 deb 包（build_deb.sh 以当前目录作为输出目录，故先 cd 到 build/Output）
.st-package-deb: &st-package-deb
  name: package-deb
  env:
    QTET_VERSION: $QTET_VERSION
  script: |
    cd build/Output
    bash ../../assets/package/linux/build_deb.sh -v "$QTET_VERSION" -a "$QTET_BUILD_ARCH"

# v* 分支专用：发布 Release（tag 已存在时该步骤允许失败，不影响构建结果）
.st-publish-release: &st-publish-release
  name: publish-release
  type: git:release
  env:
    QTET_VERSION: $QTET_VERSION
  options:
    tag: $QTET_VERSION
    description: "QtEasyTier v$QTET_VERSION（桌面版）发布"
  allowFailure: true

# =====================================================================
# Windows 公共 Stage（脚本默认走 PowerShell 5.x）
# =====================================================================

# 从 CMakeLists.txt 提取版本号（master / PR 使用）
.st-win-extract-version: &st-win-extract-version
  name: extract-version
  script: |
    $line = Select-String -Path CMakeLists.txt -Pattern '^project\(QtEasyTier VERSION ' | Select-Object -First 1
    if (-not $line) { throw '无法从 CMakeLists.txt 提取版本号' }
    $version = $line.Line -replace '^project\(QtEasyTier VERSION ([0-9]+\.[0-9]+\.[0-9]+).*', '$1'
    Write-Output "##[set-output VERSION=$version]"
  exports:
    VERSION: QTET_VERSION

# v* 分支专用：校验分支名版本与 CMakeLists.txt 一致
.st-win-extract-version-release: &st-win-extract-version-release
  name: extract-version
  script: |
    $branch = $env:CNB_BRANCH
    if (-not $branch.StartsWith('v')) { throw "分支 $branch 不是 v* release 分支" }
    $version = $branch.Substring(1)
    $pattern = '^project\(QtEasyTier VERSION ' + [regex]::Escape($version) + '\)'
    $line = Select-String -Path CMakeLists.txt -Pattern $pattern | Select-Object -First 1
    if (-not $line) { throw "CMakeLists.txt 中的版本与分支 $branch 不一致" }
    Write-Output "##[set-output VERSION=$version]"
  exports:
    VERSION: QTET_VERSION

# MSYS2 构建：configure + build + test（直接使用构建机上已装好的工具链）
# 通过调用 C:\msys64\usr\bin\bash.exe 执行，等价于 GitHub 流水线的 msys2 shell。
.st-win-build-full: &st-win-build-full
  name: build-msys2
  script: |
    $bash = @('C:\msys64\usr\bin\bash.exe', 'D:\msys64\usr\bin\bash.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
    if (-not $bash) { throw '未找到 MSYS2 bash.exe，请确认构建机上已安装 MSYS2/CLANG64 并配置好 Qt6 工具链' }

    $script = @'
    set -euxo pipefail
    export MSYSTEM=CLANG64
    export CHERE_INVOKING=1
    export PATH="/clang64/bin:/usr/bin:/bin:$PATH"
    cd "$(cygpath "$CNB_BUILD_WORKSPACE")"

    # 1. Configure（默认会克隆并构建 qtet-daemon，需要网络）
    #    显式指定 clang 编译器，避免 CMake 探测到 PATH 中其他编译器
    cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
      -DCMAKE_PREFIX_PATH=/clang64 \
      -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++

    # 2. Build
    cmake --build build --parallel

    # 3. Test
    export QT_QPA_PLATFORM=offscreen
    ctest --test-dir build --output-on-failure
    '@
    # 写入临时脚本文件再执行，避免 PowerShell 向 bash.exe 传多行引号参数被破坏
    $tmp = Join-Path $env:TEMP 'qtet_msys2_build.sh'
    [System.IO.File]::WriteAllText($tmp, $script.Replace("`r`n", "`n"))
    & $bash $tmp
    if ($LASTEXITCODE -ne 0) { throw "MSYS2 构建失败，退出码 $LASTEXITCODE" }

# windeployqt：拷贝 Qt 运行库到 build/Output（对应 GitHub Prepare Runtime 步骤）
.st-win-runtime: &st-win-runtime
  name: prepare-runtime
  script: |
    $bash = @('C:\msys64\usr\bin\bash.exe', 'D:\msys64\usr\bin\bash.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
    if (-not $bash) { throw '未找到 MSYS2 bash.exe，请确认构建机上已安装 MSYS2/CLANG64 并配置好 Qt6 工具链' }

    $script = @'
    set -euxo pipefail
    export MSYSTEM=CLANG64
    export CHERE_INVOKING=1
    export PATH="/clang64/bin:/usr/bin:/clang64/share/qt6/bin:$PATH"
    cd "$(cygpath "$CNB_BUILD_WORKSPACE")"

    windeployqt --qmldir src/qml build/Output/appQtEasyTier.exe
    '@
    $tmp = Join-Path $env:TEMP 'qtet_windeployqt.sh'
    [System.IO.File]::WriteAllText($tmp, $script.Replace("`r`n", "`n"))
    & $bash $tmp
    if ($LASTEXITCODE -ne 0) { throw "windeployqt 失败，退出码 $LASTEXITCODE" }

# 打包 zip（对应 GitHub Create Zip 步骤）
.st-win-zip: &st-win-zip
  name: create-zip
  env:
    QTET_VERSION: $QTET_VERSION
  script: |
    $version = $env:QTET_VERSION
    $zipPath = "build\Output\qteasytier_v${version}_windows_amd64.zip"
    if (Test-Path $zipPath) { Remove-Item $zipPath }
    Compress-Archive -Path 'build\Output\*' -DestinationPath $zipPath -Force
    Write-Output "已创建 $zipPath"

# Inno Setup 安装包（对应 GitHub Create Installer 步骤，构建机上需装 Inno Setup 6）
.st-win-installer: &st-win-installer
  name: build-installer
  env:
    QTET_VERSION: $QTET_VERSION
  script: |
    $version = $env:QTET_VERSION
    $root = $env:CNB_BUILD_WORKSPACE
    $iscc = @("$env:ProgramFiles\Inno Setup 6\ISCC.exe", "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
    if (-not $iscc) { throw '未找到 Inno Setup 6（ISCC.exe），请确认构建机上已安装' }

    $buildOut = Join-Path $root 'build\Output'
    $iss = Join-Path $root 'assets\package\windows\package.iss'
    & $iscc "/DMyAppVersion=$version" "/DBuildOutputDir=$buildOut" "/DPackageOutputDir=$buildOut" "/DSourceRootDir=$root" $iss
    if ($LASTEXITCODE -ne 0) { throw "Inno Setup 打包失败，退出码 $LASTEXITCODE" }

# =====================================================================
# Pipeline 基础配置（YAML 锚点，供各事件引用）
# =====================================================================

# Linux amd64：官方节点 + 自定义 Qt 构建镜像
.lnx-amd64: &lnx-amd64
  runner:
    tags: cnb:arch:amd64
  docker:
    build:
      dockerfile: .cnb/Dockerfile.linux
      buildArgs:
        QT_ARCH: linux_gcc_64
      by:
        - .cnb/Dockerfile.linux
  env:
    QTET_BUILD_ARCH: amd64

# Linux arm64：官方节点 + 自定义 Qt 构建镜像
.lnx-arm64: &lnx-arm64
  runner:
    tags: cnb:arch:arm64:v8
  docker:
    build:
      dockerfile: .cnb/Dockerfile.linux
      buildArgs:
        QT_ARCH: linux_gcc_arm64
      by:
        - .cnb/Dockerfile.linux
  env:
    QTET_BUILD_ARCH: arm64

# Windows：你自己连接的构建机（namespace: group + 节点标签）
# 若你的构建机标签不是 "windows"，请在此处改为实际标签（如 [windows, x86_64]）。
.win: &win
  runner:
    namespace: group
    tags:
      - windows

# =====================================================================
# 事件编排
# =====================================================================

# ---- master 分支 push：构建 + 测试 + 打包（对应 build-master.yml） ----
master:
  push:
    linux-amd64:
      <<: *lnx-amd64
      name: Linux amd64 (master)
      stages:
        - *st-extract-version
        - *st-show-qt
        - *st-configure
        - *st-build
        - *st-test
        - *st-package-deb
    linux-arm64:
      <<: *lnx-arm64
      name: Linux arm64 (master)
      stages:
        - *st-extract-version
        - *st-show-qt
        - *st-configure
        - *st-build
        - *st-test
        - *st-package-deb
    windows:
      <<: *win
      name: Windows amd64 (master)
      stages:
        - *st-win-extract-version
        - *st-win-build-full
        - *st-win-runtime
        - *st-win-zip
        - *st-win-installer

# ---- 任意分支 PR：构建 + 测试（对应 build-pr.yml，不打包） ----
"**":
  pull_request:
    linux-amd64:
      <<: *lnx-amd64
      name: Linux amd64 (PR check)
      stages:
        - *st-extract-version
        - *st-show-qt
        - *st-configure
        - *st-build
        - *st-test
    linux-arm64:
      <<: *lnx-arm64
      name: Linux arm64 (PR check)
      stages:
        - *st-extract-version
        - *st-show-qt
        - *st-configure
        - *st-build
        - *st-test
    windows:
      <<: *win
      name: Windows amd64 (PR check)
      stages:
        - *st-win-extract-version
        - *st-win-build-full

# ---- vX.Y.Z 分支 push：构建 + 打包 + 发布 Release（对应 build-release.yml） ----
v*:
  push:
    linux-amd64:
      <<: *lnx-amd64
      name: Linux amd64 (release)
      stages:
        - *st-extract-version-release
        - *st-show-qt
        - *st-configure
        - *st-build
        - *st-test
        - *st-package-deb
        - *st-publish-release
    linux-arm64:
      <<: *lnx-arm64
      name: Linux arm64 (release)
      stages:
        - *st-extract-version-release
        - *st-show-qt
        - *st-configure
        - *st-build
        - *st-test
        - *st-package-deb
    windows:
      <<: *win
      name: Windows amd64 (release)
      stages:
        - *st-win-extract-version-release
        - *st-win-build-full
        - *st-win-runtime
        - *st-win-zip
        - *st-win-installer
